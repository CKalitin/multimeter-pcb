; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
include_dir = Core/Inc
src_dir = .

[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube

; Standard embedded approach - use local FreeRTOS with CMSIS-RTOS v2
build_flags = 
    -D USE_CMSIS_RTOS_V2=1         # Enable CMSIS-RTOS v2 API
    -D configMEMMANG_HEAP_NB=4     # Use heap_4.c memory management
    -D STM32F103xB                 # Your specific MCU variant
    -I Core/Inc                    # Project headers (includes FreeRTOSConfig.h)
    -I Middlewares/Third_Party/FreeRTOS/Source/include
    -I Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
    -I Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM3
    -I Drivers/CMSIS/Device/ST/STM32F1xx/Include

build_src_filter = 
    +<Core/Src/*>                          
    +<Middlewares/Third_Party/FreeRTOS/Source/*.c>  
    +<Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2/*.c>  
    +<Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM3/*.c>  
    +<Middlewares/Third_Party/FreeRTOS/Source/portable/MemMang/heap_4.c>

; Note that we don't include all of middlewares or drivers so that we can have smaller builds (less time, flash, conflicts, etc.)